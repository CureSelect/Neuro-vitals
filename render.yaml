services:
  - type: web
    name: neurovitals-api
    runtime: docker
    plan: standard # ML models require more than the 512MB free/starter tier
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8080
      - key: PYTHON_VERSION
        value: 3.10.0
